    <main class="contenido-principal">
        <section class="seccion-contacto">
            <h2>Comunícate conmigo</h2>
            <p> Si deseas contactarme por una oportunidad laboral, académica o relacionada con mis proyectos, puedes
                completar el siguiente formulario. </p>
            <form class="formulario-contacto">
                <div class="campo-formulario"> <label for="nombre">Nombre:</label> <input type="text" id="nombre"
                        name="nombre" required> </div> <br>
                <div class="campo-formulario"> <label for="correo">Correo:</label> <input type="email" id="correo"
                        name="correo" required> </div> <br>
                <div class="campo-formulario"> <label for="asunto">Asunto:</label> <input type="text" id="asunto"
                        name="asunto" required> </div> <br>
                <div class="campo-formulario"> <label for="mensaje">Mensaje:</label> <textarea id="mensaje"
                        name="mensaje" rows="6" cols="40" required></textarea> </div> <br> <button type="submit"
                    class="boton-enviar"> Enviar mensaje </button>
            </form>
        </section>
    </main>
